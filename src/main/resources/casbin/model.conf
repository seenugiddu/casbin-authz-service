# RBAC model with role hierarchy and explicit allow/deny effects.
#
# Request  : (role, resource, action)
# Policy   : (role, resource-pattern, action-pattern, effect)
# Roles    : g, child-role, parent-role   (child inherits parent's policies)
# Matching : keyMatch supports "*" in resource patterns,
#            regexMatch allows action patterns such as "(read|write)" or ".*"
#            (jCasbin uses Pattern.lookingAt: anchored at the start only; use
#             "^read$"-style patterns if you need exact action matches)
# Effect   : allowed if at least one "allow" matches and no "deny" matches.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act, eft

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = g(r.sub, p.sub) && keyMatch(r.obj, p.obj) && regexMatch(r.act, p.act)
